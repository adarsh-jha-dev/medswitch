name: Refresh price snapshots

# commented the cron job out for now, to avoid running out of credits
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3,11,19 * * *" # 08:30, 16:30, 00:30 IST — 3x/day, staggered

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        retailer: [pharmeasy]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh ${{ matrix.retailer }} price snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          SCRAPE_PINCODE: "700001"
        run: pnpm ingest --retailer=${{ matrix.retailer }} --refresh-only
